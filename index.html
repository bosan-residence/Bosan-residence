<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BOSAN SYSTEM · Вхід</title>
<meta name="theme-color" content="#123f31">
<link rel="manifest" href="./manifest.json">
<style>
:root{--green:#123f31;--bg:#f4f2ec;--card:#fff;--line:#dedbd2;--muted:#73736f;--danger:#9c342d}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:#17201c}.app{max-width:560px;margin:auto;min-height:100vh}.top{background:var(--green);color:#fff;padding:18px 16px;box-shadow:0 4px 14px #0002}.brand{display:flex;justify-content:space-between;align-items:center}.brand b{font-size:20px;letter-spacing:2px}.brand small{opacity:.75}.pill{font-size:11px;padding:6px 9px;border:1px solid #ffffff55;border-radius:999px}main{padding:13px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-top:48px}.title{font-weight:900;font-size:22px;margin-bottom:8px}.sub{font-size:13px;color:var(--muted);line-height:1.5}input{width:100%;padding:14px;border:1px solid var(--line);border-radius:11px;background:#fff;margin-top:10px;font:inherit}.btn{width:100%;border:0;border-radius:12px;padding:14px 12px;font-weight:800;background:var(--green);color:#fff;margin-top:12px;font:inherit}.msg{font-size:12px;margin-top:12px;line-height:1.45}.msg.error{color:var(--danger)}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="app">
<header class="top"><div class="brand"><div><b>BOSAN</b><small> RESIDENCE</small></div><div class="pill">ВХІД</div></div></header>
<main>
<section class="card">
<div class="title">Вхід у BOSAN SYSTEM</div>
<p class="sub">Введіть e-mail і пароль.</p>
<input id="loginEmail" type="email" autocomplete="email" placeholder="E-mail">
<input id="loginPassword" type="password" autocomplete="current-password" placeholder="Пароль">
<button id="loginBtn" class="btn">Увійти</button>
<div id="loginMsg" class="msg"></div>
</section>
</main>
</div>
<script>
const SUPABASE_URL='https://eonflhmttzpbqzzqkhon.supabase.co';
const SUPABASE_KEY='sb_publishable_XKHT-jFqx5nn4dfMODy0Ew_Ndmje_0P';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
async function goIfSignedIn(){const {data:{session}}=await sb.auth.getSession();if(session) location.replace('./index_backup.html')}
async function signIn(){
 const email=loginEmail.value.trim(); const password=loginPassword.value;
 loginMsg.className='msg';
 if(!email||!password){loginMsg.textContent='Введіть e-mail і пароль.';loginMsg.classList.add('error');return}
 loginBtn.disabled=true; loginBtn.textContent='Входимо…'; loginMsg.textContent='';
 const {error}=await sb.auth.signInWithPassword({email,password});
 if(error){loginMsg.textContent='Не вдалося увійти. Перевірте e-mail і пароль.';loginMsg.classList.add('error');loginBtn.disabled=false;loginBtn.textContent='Увійти';return}
 location.replace('./index_backup.html');
}
loginBtn.addEventListener('click',signIn);
loginPassword.addEventListener('keydown',e=>{if(e.key==='Enter')signIn()});
goIfSignedIn();
if('serviceWorker' in navigator){navigator.serviceWorker.register('./service-worker.js').catch(()=>{})}
</script>
</body>
</html>
