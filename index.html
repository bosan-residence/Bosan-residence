<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BOSAN SYSTEM · Вхід</title>
<meta name="theme-color" content="#123f31">
<link rel="manifest" href="./manifest.json">
<style>
:root{--green:#123f31;--bg:#f4f2ec;--card:#fff;--line:#dedbd2;--muted:#73736f;--danger:#9c342d;--ok:#23734d}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:#17201c}.app{max-width:560px;margin:auto;min-height:100vh}.top{background:var(--green);color:#fff;padding:18px 16px;box-shadow:0 4px 14px #0002}.brand{display:flex;justify-content:space-between;align-items:center}.brand b{font-size:20px;letter-spacing:2px}.brand small{opacity:.75}.pill{font-size:11px;padding:6px 9px;border:1px solid #ffffff55;border-radius:999px}main{padding:13px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-top:48px}.title{font-weight:900;font-size:22px;margin-bottom:8px}.sub{font-size:13px;color:var(--muted);line-height:1.5}input{width:100%;padding:14px;border:1px solid var(--line);border-radius:11px;background:#fff;margin-top:10px;font:inherit}.btn{width:100%;border:0;border-radius:12px;padding:14px 12px;font-weight:800;background:var(--green);color:#fff;margin-top:12px;font:inherit}.msg{font-size:12px;margin-top:12px;line-height:1.45}.msg.error{color:var(--danger)}.msg.ok{color:var(--ok)}.hidden{display:none!important}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="app">
<header class="top"><div class="brand"><div><b>BOSAN</b><small> RESIDENCE</small></div><div class="pill" id="pill">ВХІД</div></div></header>
<main>
<section class="card" id="loginCard">
<div class="title">Вхід у BOSAN SYSTEM</div>
<p class="sub">Введіть e-mail і пароль.</p>
<input id="loginEmail" type="email" autocomplete="email" placeholder="E-mail">
<input id="loginPassword" type="password" autocomplete="current-password" placeholder="Пароль">
<button id="loginBtn" class="btn">Увійти</button>
<div id="loginMsg" class="msg"></div>
</section>
<section class="card hidden" id="recoveryCard">
<div class="title">Новий пароль</div>
<p class="sub">Введіть новий пароль для BOSAN SYSTEM двічі.</p>
<input id="newPassword" type="password" autocomplete="new-password" placeholder="Новий пароль">
<input id="newPassword2" type="password" autocomplete="new-password" placeholder="Повторіть новий пароль">
<button id="savePasswordBtn" class="btn">Зберегти новий пароль</button>
<div id="recoveryMsg" class="msg"></div>
</section>
</main>
</div>
<script>
const SUPABASE_URL='https://eonflhmttzpbqzzqkhon.supabase.co';
const SUPABASE_KEY='sb_publishable_XKHT-jFqx5nn4dfMODy0Ew_Ndmje_0P';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let recoveryMode=false;
function showRecovery(){recoveryMode=true;loginCard.classList.add('hidden');recoveryCard.classList.remove('hidden');pill.textContent='НОВИЙ ПАРОЛЬ'}
function openApp(){location.replace('./index_backup.html')}
async function signIn(){const email=loginEmail.value.trim();const password=loginPassword.value;loginMsg.className='msg';if(!email||!password){loginMsg.textContent='Введіть e-mail і пароль.';loginMsg.classList.add('error');return}loginBtn.disabled=true;loginBtn.textContent='Входимо…';loginMsg.textContent='';const {error}=await sb.auth.signInWithPassword({email,password});if(error){loginMsg.textContent='Не вдалося увійти. Перевірте e-mail і пароль.';loginMsg.classList.add('error');loginBtn.disabled=false;loginBtn.textContent='Увійти';return}openApp()}
async function saveNewPassword(){const p1=newPassword.value;const p2=newPassword2.value;recoveryMsg.className='msg';if(p1.length<8){recoveryMsg.textContent='Пароль має містити щонайменше 8 символів.';recoveryMsg.classList.add('error');return}if(p1!==p2){recoveryMsg.textContent='Паролі не співпадають.';recoveryMsg.classList.add('error');return}savePasswordBtn.disabled=true;savePasswordBtn.textContent='Зберігаємо…';const {error}=await sb.auth.updateUser({password:p1});if(error){recoveryMsg.textContent='Не вдалося змінити пароль. Відкрийте свіжий лист відновлення ще раз.';recoveryMsg.classList.add('error');savePasswordBtn.disabled=false;savePasswordBtn.textContent='Зберегти новий пароль';return}recoveryMsg.textContent='Пароль змінено. Відкриваємо BOSAN SYSTEM…';recoveryMsg.classList.add('ok');setTimeout(openApp,700)}
loginBtn.addEventListener('click',signIn);loginPassword.addEventListener('keydown',e=>{if(e.key==='Enter')signIn()});savePasswordBtn.addEventListener('click',saveNewPassword);
if(location.hash.includes('type=recovery')||location.search.includes('type=recovery')) showRecovery();
sb.auth.onAuthStateChange((event,session)=>{if(event==='PASSWORD_RECOVERY'){showRecovery();return}if(!recoveryMode&&session) openApp()});
(async()=>{const {data:{session}}=await sb.auth.getSession();if(session&&!recoveryMode) openApp()})();
if('serviceWorker' in navigator){navigator.serviceWorker.register('./service-worker.js').catch(()=>{})}
</script>
</body>
</html>
