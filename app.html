<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#123f31"><title>BOSAN SYSTEM</title><style>
:root{--g:#123f31;--bg:#f4f2ec;--c:#fff;--l:#dedbd2;--m:#73736f}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:#17201c}button,input,select,textarea{font:inherit}.app{max-width:560px;margin:auto;min-height:100vh;padding-bottom:84px}.top{position:sticky;top:0;z-index:20;background:var(--g);color:#fff;padding:14px 16px}.brand{display:flex;justify-content:space-between;align-items:center}.brand b{font-size:20px;letter-spacing:2px}.brand small{opacity:.75}.user{font-size:11px;padding:6px 9px;border:1px solid #ffffff55;border-radius:999px}main{padding:13px}.screen{display:none}.screen.active{display:block}.card{background:var(--c);border:1px solid var(--l);border-radius:18px;padding:14px;margin-bottom:12px}.title{font-weight:900;font-size:18px;margin-bottom:8px}.sub{font-size:12px;color:var(--m);line-height:1.45}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stat,.cat,.obj{background:#faf9f6;border:1px solid var(--l);border-radius:13px;padding:11px}.stat span{display:block;font-size:11px;color:var(--m)}.stat b{font-size:18px}.btn{border:0;border-radius:12px;padding:11px 12px;font-weight:800;background:var(--g);color:#fff}.light{background:#fff;color:#17201c;border:1px solid var(--l)}input,select,textarea{width:100%;padding:11px;border:1px solid var(--l);border-radius:11px;background:#fff;margin-top:8px}textarea{min-height:62px}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(560px,100%);background:#fff;border-top:1px solid var(--l);display:grid;grid-template-columns:repeat(5,1fr);padding:7px 4px calc(7px + env(safe-area-inset-bottom));z-index:30}.nav{border:0;background:transparent;font-size:10px;color:#555}.nav strong{display:block;font-size:19px}.nav.active{color:var(--g);font-weight:900}.row{display:flex;justify-content:space-between;gap:8px;align-items:center;border-top:1px solid var(--l);padding:10px 0}.row:first-child{border-top:0}.meta{font-size:11px;color:var(--m);margin-top:3px}.badge{font-size:10px;padding:5px 7px;border-radius:999px;background:#e6f1eb;color:var(--g);font-weight:800}.seg{display:grid;grid-template-columns:1fr 1fr;background:#eeeae1;border-radius:12px;padding:3px;margin:10px 0 12px}.seg button{border:0;background:transparent;padding:9px;border-radius:9px;font-weight:800;color:#666}.seg button.active{background:#fff;color:var(--g)}.cats,.objs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}.cat,.obj{text-align:left}.cat b,.obj b{display:block}.cat span{display:block;font-size:11px;color:var(--m);margin-top:4px}.cat.active,.obj.active{background:#eaf2ee;border-color:#8eb2a4;color:var(--g)}.hide{display:none!important}.pool{background:#f2f7f4;border:1px solid #cbd9d2;border-radius:14px;padding:11px;margin-top:10px}.booking{border:1px solid var(--l);border-radius:13px;padding:10px;margin-top:8px}.empty{text-align:center;color:var(--m);padding:18px;font-size:13px}
</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><div class="app"><header class="top"><div class="brand"><div><b>BOSAN</b><small> RESIDENCE</small></div><div class="user" id="rolePill">...</div></div></header><main>
<section class="screen active" id="home"><div class="card"><div class="title">Головна · сьогодні</div><div class="grid"><div class="stat"><span>Бронювання</span><b id="kpiBookings">0</b></div><div class="stat"><span>Гості</span><b id="kpiGuests">0</b></div><div class="stat"><span>Оплачено</span><b id="kpiPaid">0 ₴</b></div><div class="stat"><span>До оплати</span><b id="kpiDue">0 ₴</b></div></div></div><div class="card"><div class="title">Сьогодні</div><div id="todayList"></div></div><div class="card"><button class="btn" style="width:100%" onclick="go('booking');mode('new')">+ Нове бронювання</button></div></section>
<section class="screen" id="booking"><div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><div><div class="title" style="margin:0">Бронювання</div><div class="sub">Календар і нові броні</div></div><button class="btn" onclick="mode('new')">+ Нова</button></div><div class="seg"><button id="tabCal" class="active" onclick="mode('cal')">Календар</button><button id="tabNew" onclick="mode('new')">Нова бронь</button></div><div id="calView"><input id="calDate" type="date" onchange="renderCal()"><div id="calList"></div></div><div id="newView" class="hide"><div class="sub"><b>1. Що бронюємо?</b></div><div class="cats" id="cats"></div><div id="objWrap" class="hide"><div class="sub" style="margin-top:12px"><b>2. Оберіть об’єкт</b></div><div class="objs" id="objs"></div></div><div id="poolBox" class="pool hide"><b id="poolName">Басейн</b><div class="sub" id="poolCap"></div><input id="bLoungers" type="number" min="1" value="1" placeholder="Кількість шезлонгів"></div><div id="details" class="hide"><div class="sub" style="margin-top:12px"><b>3. Гість і дата</b></div><input id="bGuest" placeholder="Ім’я гостя"><input id="bPhone" placeholder="Телефон"><input id="bStart" type="date"><input id="bEnd" type="date" class="hide"><div id="times" class="hide"><div class="sub" style="margin-top:8px">Час початку</div><input id="bStartTime" type="time" value="12:00" onchange="syncEndTime()"><div class="sub" style="margin-top:8px">Тривалість</div><select id="bDuration" onchange="durationChanged()"><option value="2">2 години</option><option value="3" selected>3 години</option><option value="4">4 години</option><option value="custom">Інша</option></select><div id="customDurationWrap" class="hide"><input id="bCustomDuration" type="number" min="0.5" step="0.5" value="3" placeholder="Скільки годин" oninput="syncEndTime()"></div><div class="sub" id="endTimeHint" style="margin-top:7px">Закінчення: 15:00</div></div><input id="bGuests" type="number" min="1" value="1" placeholder="Кількість гостей"><input id="bAmount" type="number" min="0" placeholder="Сума, грн"><input id="bPrepayment" type="number" min="0" placeholder="Аванс, грн"><textarea id="bNotes" placeholder="Примітка"></textarea><button class="btn" style="width:100%;margin-top:10px" onclick="addBooking()">Зберегти бронювання</button></div></div></div></section>
<section class="screen" id="guest"><div class="card"><div class="title">Гості BOSAN</div><div id="guestList"></div></div></section><section class="screen" id="cash"><div class="card"><div class="title">Каса</div><select id="payBooking"></select><input id="payAmount" type="number" min="0" placeholder="Сума, грн"><select id="payMethod"><option>Готівка</option><option>Картка</option><option>IBAN / переказ</option></select><button class="btn" style="width:100%;margin-top:10px" onclick="addPayment()">Провести оплату</button></div><div class="card"><div id="paymentList"></div></div></section><section class="screen" id="more"><div class="card"><div class="title">Персонал</div><div id="staffList"></div></div><div class="card"><button class="btn" style="width:100%;background:#9c342d" onclick="logout()">Вийти</button></div></section>
</main><nav class="bottom"><button class="nav active" data-go="home"><strong>⌂</strong>Головна</button><button class="nav" data-go="booking"><strong>▣</strong>Бронь</button><button class="nav" data-go="guest"><strong>♙</strong>Гості</button><button class="nav" data-go="cash"><strong>₴</strong>Каса</button><button class="nav" data-go="more"><strong>•••</strong>Ще</button></nav></div><script>
const sb=window.supabase.createClient('https://eonflhmttzpbqzzqkhon.supabase.co','sb_publishable_XKHT-jFqx5nn4dfMODy0Ew_Ndmje_0P');let staff=null,objects=[],omap=new Map(),bookings=[],payments=[],selectedType='',selectedId='';const money=v=>new Intl.NumberFormat('uk-UA').format(Number(v||0))+' ₴',esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),today=()=>new Date().toLocaleDateString('sv-SE'),date=v=>String(v||'').slice(0,10),time=v=>v?new Date(v).toLocaleTimeString('uk-UA',{hour:'2-digit',minute:'2-digit'}):'';
function go(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x.dataset.go===id));if(id==='booking')renderCal();scrollTo(0,0)}document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>go(b.dataset.go));function mode(x){let c=x==='cal';calView.classList.toggle('hide',!c);newView.classList.toggle('hide',c);tabCal.classList.toggle('active',c);tabNew.classList.toggle('active',!c)}
const types=[['house','Будиночки','5 будиночків · подобово'],['pool','Басейни','№1 — 24 · №2 — 40'],['sauna','Баня','по часу'],['hot_tub','Чани','4 чани'],['bungalow','Бунгало','3 × 6 місць'],['terrace','Тераса','12 місць']];function renderTypes(){cats.innerHTML=types.map(t=>`<button class="cat ${selectedType===t[0]?'active':''}" onclick="pickType('${t[0]}')"><b>${t[1]}</b><span>${t[2]}</span></button>`).join('')}function pickType(t){selectedType=t;selectedId='';renderTypes();let a=objects.filter(o=>o.type===t);objs.innerHTML=a.map(o=>`<button class="obj" data-id="${o.id}" onclick="pickObj('${o.id}')"><b>${esc(o.name)}</b><span class="sub">${o.capacity?o.capacity+' місць':''}</span></button>`).join('');objWrap.classList.remove('hide');details.classList.add('hide');poolBox.classList.add('hide')}function pickObj(id){selectedId=id;document.querySelectorAll('.obj').forEach(b=>b.classList.toggle('active',b.dataset.id===id));let o=omap.get(id);details.classList.remove('hide');let h=o.type==='house',tim=['sauna','hot_tub'].includes(o.type),p=o.type==='pool';bEnd.classList.toggle('hide',!h);times.classList.toggle('hide',!tim);poolBox.classList.toggle('hide',!p);if(tim)syncEndTime();if(p){poolName.textContent=o.name;poolCap.textContent=(o.capacity||0)+' шезлонгів. Довгого списку 1–40 більше немає.'}}
async function boot(){let {data:{session}}=await sb.auth.getSession();if(!session){location.replace('/login.html');return}let r=await sb.from('staff').select('id,name,role,active').eq('user_id',session.user.id).eq('active',true).maybeSingle();if(r.error||!r.data){await sb.auth.signOut();location.replace('/login.html?err=staff');return}staff=r.data;rolePill.textContent=(staff.role||'staff').toUpperCase()+' · '+staff.name;calDate.value=today();bStart.value=today();await Promise.all([loadObjects(),loadBookings(),loadPayments(),loadStaff()]);renderTypes();render()}
async function loadObjects(){let r=await sb.from('objects').select('id,name,type,parent_name,capacity').eq('active',true).order('name');if(r.error)return;objects=r.data||[];omap=new Map(objects.map(o=>[o.id,o]))}async function loadBookings(){let r=await sb.from('bookings').select('id,start_at,end_at,status,total,prepayment,debt,guests,notes,object_id,clients(name,phone),objects(name,type)').neq('status','cancelled').order('start_at',{ascending:false}).limit(300);if(r.error){alert(r.error.message);return}bookings=(r.data||[]).map(x=>({id:x.id,start:x.start_at,end:x.end_at,total:Number(x.total||0),prepayment:Number(x.prepayment||0),debt:Number(x.debt||0),guests:Number(x.guests||1),notes:x.notes||'',oid:x.object_id,obj:x.objects?.name||'Об’єкт',type:x.objects?.type||'',guest:x.clients?.name||'Гість',phone:x.clients?.phone||''}))}async function loadPayments(){let r=await sb.from('payments').select('id,booking_id,amount,payment_method,created_at').order('created_at',{ascending:false}).limit(300);payments=(r.data||[]).map(x=>({id:x.id,bid:x.booking_id,amount:Number(x.amount||0),method:x.payment_method,created:x.created_at}))}async function loadStaff(){let r=await sb.from('staff').select('name,role').eq('active',true).order('name');staffList.innerHTML=(r.data||[]).map(x=>`<div class="row"><b>${esc(x.name)}</b><span class="badge">${esc((x.role||'staff').toUpperCase())}</span></div>`).join('')}
function durationHours(){return bDuration.value==='custom'?Number(bCustomDuration.value||0):Number(bDuration.value||0)}function durationChanged(){customDurationWrap.classList.toggle('hide',bDuration.value!=='custom');syncEndTime()}function endTimeFrom(start,hours){let [h,m]=String(start||'12:00').split(':').map(Number),mins=h*60+m+Math.round(hours*60);mins=((mins%1440)+1440)%1440;return String(Math.floor(mins/60)).padStart(2,'0')+':'+String(mins%60).padStart(2,'0')}function syncEndTime(){if(typeof endTimeHint==='undefined')return;let hrs=durationHours();endTimeHint.textContent=hrs>0?'Закінчення: '+endTimeFrom(bStartTime.value,hrs):'Вкажіть тривалість'}
async function client(name,phone){let q=sb.from('clients').select('id,name,phone');q=phone?q.eq('phone',phone):q.eq('name',name);let r=await q.limit(1).maybeSingle();if(r.error)throw r.error;if(r.data)return r.data;let n=await sb.from('clients').insert({name,phone:phone||null}).select('id').single();if(n.error)throw n.error;return n.data}async function addBooking(){let o=omap.get(selectedId),name=bGuest.value.trim(),phone=bPhone.value.trim();if(!o||!name||!bStart.value){alert('Оберіть об’єкт, дату та введіть ім’я гостя');return}if(o.type==='house'&&!bEnd.value){alert('Вкажіть дату виїзду');return}let timed=['sauna','hot_tub'].includes(o.type),st=timed?bStartTime.value:'12:00',hrs=timed?durationHours():0,et=timed?endTimeFrom(st,hrs):'12:00',ed=o.type==='house'?bEnd.value:bStart.value;if(timed&&hrs<=0){alert('Вкажіть тривалість');return}let note=[bNotes.value.trim(),timed?`Тривалість: ${hrs} год.`:'',o.type==='pool'?`Шезлонгів: ${Number(bLoungers.value||1)}`:''].filter(Boolean).join(' · ');try{let c=await client(name,phone),r=await sb.from('bookings').insert({client_id:c.id,object_id:o.id,start_at:`${bStart.value}T${st}:00+03:00`,end_at:`${ed}T${et}:00+03:00`,guests:Number(bGuests.value||1),total:Number(bAmount.value||0),prepayment:Number(bPrepayment.value||0),debt:Math.max(0,Number(bAmount.value||0)-Number(bPrepayment.value||0)),notes:note||null,status:'booked',created_by:staff.id});if(r.error)throw r.error;bPrepayment.value='';await loadBookings();render();renderCal();mode('cal')}catch(e){alert('Не вдалося зберегти: '+e.message)}}
function renderCal(){let d=calDate.value||today(),a=bookings.filter(x=>date(x.start)===d||(date(x.start)<=d&&date(x.end)>=d)),order=types.map(x=>[x[1],x[0]]);calList.innerHTML=order.map(g=>{let z=a.filter(x=>x.type===g[1]);return z.length?`<div style="margin-top:12px"><b>${g[0]}</b>${z.map(x=>`<div class="booking"><div style="display:flex;justify-content:space-between;gap:8px"><div><b>${esc(x.obj)}</b><div class="meta">${esc(x.guest)} · ${esc(x.phone||'без телефону')}</div></div><span class="badge">${money(x.total)}</span></div><div class="meta">${time(x.start)} — ${time(x.end)} · ${x.guests} гост.${x.prepayment?' · аванс '+money(x.prepayment):''}${x.notes?' · '+esc(x.notes):''}</div></div>`).join('')}</div>`:''}).join('')||'<div class="empty">На цю дату бронювань немає.</div>'}function paid(id){return payments.filter(x=>x.bid===id).reduce((s,x)=>s+x.amount,0)}function render(){let t=today(),a=bookings.filter(x=>date(x.start)===t||(date(x.start)<=t&&date(x.end)>=t)),sum=a.reduce((s,x)=>s+x.total,0),pd=a.reduce((s,x)=>s+paid(x.id),0);kpiBookings.textContent=a.length;kpiGuests.textContent=a.reduce((s,x)=>s+x.guests,0);kpiPaid.textContent=money(pd);kpiDue.textContent=money(Math.max(0,sum-pd));todayList.innerHTML=a.length?a.map(x=>`<div class="row"><div><b>${esc(x.obj)}</b><div class="meta">${esc(x.guest)} · ${time(x.start)}</div></div><span class="badge">${money(x.total)}</span></div>`).join(''):'<div class="empty">На сьогодні бронювань немає.</div>';guestList.innerHTML=bookings.length?bookings.map(x=>`<div class="row"><div><b>${esc(x.guest)}</b><div class="meta">${esc(x.phone||'без телефону')} · ${esc(x.obj)}</div></div><b>${money(Math.max(0,x.total-paid(x.id)))}</b></div>`).join(''):'<div class="empty">Гостей ще немає.</div>';payBooking.innerHTML='<option value="">Оберіть бронювання</option>'+bookings.map(x=>`<option value="${x.id}">${esc(x.obj)} · ${esc(x.guest)}</option>`).join('');paymentList.innerHTML=payments.length?payments.map(p=>`<div class="row"><div><b>${esc(p.method)}</b><div class="meta">${new Date(p.created).toLocaleString('uk-UA')}</div></div><b>${money(p.amount)}</b></div>`).join(''):'<div class="empty">Операцій немає.</div>'}async function addPayment(){let id=payBooking.value,amount=Number(payAmount.value||0);if(!id||!amount)return alert('Оберіть бронювання та суму');let m={'Готівка':'cash','Картка':'card','IBAN / переказ':'transfer'},r=await sb.from('payments').insert({booking_id:id,amount,payment_method:m[payMethod.value]||'cash',payment_type:'payment',accepted_by:staff.id});if(r.error)return alert(r.error.message);payAmount.value='';await loadPayments();render()}async function logout(){await sb.auth.signOut();location.replace('/login.html')}boot();
</script></body></html>
