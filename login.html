<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BOSAN SYSTEM · Вхід</title>
<style>
:root{--green:#123f31;--bg:#f4f2ec;--card:#fff;--line:#dedbd2;--muted:#73736f;--danger:#9c342d;--ok:#276749}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:#17201c}.app{max-width:560px;margin:auto;min-height:100vh}.top{background:var(--green);color:#fff;padding:18px 16px;box-shadow:0 4px 14px #0002}.brand{display:flex;justify-content:space-between;align-items:center}.brand b{font-size:20px;letter-spacing:2px}.brand small{opacity:.75}.pill{font-size:11px;padding:6px 9px;border:1px solid #ffffff55;border-radius:999px}main{padding:13px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-top:48px}.title{font-weight:900;font-size:22px;margin-bottom:8px}.sub{font-size:13px;color:var(--muted);line-height:1.5}input{width:100%;padding:14px;border:1px solid var(--line);border-radius:11px;background:#fff;margin-top:10px;font:inherit}.btn{width:100%;border:0;border-radius:12px;padding:14px 12px;font-weight:800;background:var(--green);color:#fff;margin-top:12px;font:inherit}.linkbtn{width:100%;border:0;background:transparent;color:var(--green);padding:13px 6px 4px;font:inherit;font-weight:700;text-decoration:underline}.msg{font-size:12px;margin-top:12px;line-height:1.45}.msg.error{color:var(--danger)}.msg.ok{color:var(--ok)}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="app">
<header class="top"><div class="brand"><div><b>BOSAN</b><small> RESIDENCE</small></div><div class="pill">ВХІД</div></div></header>
<main><section class="card"><div class="title">Вхід у BOSAN SYSTEM</div><p class="sub">Введіть e-mail і пароль.</p><input id="loginEmail" type="email" autocomplete="email" placeholder="E-mail"><input id="loginPassword" type="password" autocomplete="current-password" placeholder="Пароль"><button id="loginBtn" class="btn">Увійти</button><button id="resetBtn" class="linkbtn" type="button">Забули пароль?</button><div id="loginMsg" class="msg"></div></section></main>
</div>
<script>
const sb=window.supabase.createClient('https://eonflhmttzpbqzzqkhon.supabase.co','sb_publishable_XKHT-jFqx5nn4dfMODy0Ew_Ndmje_0P');
function openApp(){location.replace('./app-gate.html?v=20260910-password')}
async function goIfSignedIn(){const {data:{session}}=await sb.auth.getSession();if(session)openApp()}
async function signIn(){const email=loginEmail.value.trim(),password=loginPassword.value;loginMsg.className='msg';if(!email||!password){loginMsg.textContent='Введіть e-mail і пароль.';loginMsg.classList.add('error');return}loginBtn.disabled=true;loginBtn.textContent='Входимо…';loginMsg.textContent='';const {error}=await sb.auth.signInWithPassword({email,password});if(error){loginMsg.textContent='Не вдалося увійти. Перевірте e-mail і пароль.';loginMsg.classList.add('error');loginBtn.disabled=false;loginBtn.textContent='Увійти';return}openApp()}
async function resetPassword(){const email=loginEmail.value.trim();loginMsg.className='msg';if(!email){loginMsg.textContent='Спочатку введіть e-mail.';loginMsg.classList.add('error');return}resetBtn.disabled=true;resetBtn.textContent='Надсилаємо…';const redirectTo=new URL('./reset-password.html',location.href).href;const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo});if(error){loginMsg.textContent='Не вдалося надіслати лист. Спробуйте ще раз трохи пізніше.';loginMsg.classList.add('error')}else{loginMsg.textContent='Лист для створення нового пароля надіслано. Перевірте пошту.';loginMsg.classList.add('ok')}resetBtn.disabled=false;resetBtn.textContent='Забули пароль?'}
loginBtn.addEventListener('click',signIn);resetBtn.addEventListener('click',resetPassword);loginPassword.addEventListener('keydown',e=>{if(e.key==='Enter')signIn()});goIfSignedIn();
</script></body></html>
