<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BOSAN SYSTEM · Новий пароль</title>
<style>
:root{--green:#123f31;--bg:#f4f2ec;--card:#fff;--line:#dedbd2;--muted:#73736f;--danger:#9c342d;--ok:#276749}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:#17201c}.app{max-width:560px;margin:auto;min-height:100vh}.top{background:var(--green);color:#fff;padding:18px 16px;box-shadow:0 4px 14px #0002}.brand{display:flex;justify-content:space-between;align-items:center}.brand b{font-size:20px;letter-spacing:2px}.brand small{opacity:.75}.pill{font-size:11px;padding:6px 9px;border:1px solid #ffffff55;border-radius:999px}main{padding:13px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-top:48px}.title{font-weight:900;font-size:22px;margin-bottom:8px}.sub{font-size:13px;color:var(--muted);line-height:1.5}input{width:100%;padding:14px;border:1px solid var(--line);border-radius:11px;background:#fff;margin-top:10px;font:inherit}.btn{width:100%;border:0;border-radius:12px;padding:14px 12px;font-weight:800;background:var(--green);color:#fff;margin-top:12px;font:inherit}.msg{font-size:12px;margin-top:12px;line-height:1.45}.msg.error{color:var(--danger)}.msg.ok{color:var(--ok)}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body><div class="app"><header class="top"><div class="brand"><div><b>BOSAN</b><small> RESIDENCE</small></div><div class="pill">ПАРОЛЬ</div></div></header><main><section class="card"><div class="title">Створіть новий пароль</div><p class="sub">Введіть новий пароль двічі.</p><input id="p1" type="password" autocomplete="new-password" placeholder="Новий пароль"><input id="p2" type="password" autocomplete="new-password" placeholder="Повторіть пароль"><button id="saveBtn" class="btn">Зберегти пароль</button><div id="msg" class="msg"></div></section></main></div>
<script>
const sb=window.supabase.createClient('https://eonflhmttzpbqzzqkhon.supabase.co','sb_publishable_XKHT-jFqx5nn4dfMODy0Ew_Ndmje_0P');
async function save(){const a=p1.value,b=p2.value;msg.className='msg';if(a.length<8){msg.textContent='Пароль має містити щонайменше 8 символів.';msg.classList.add('error');return}if(a!==b){msg.textContent='Паролі не збігаються.';msg.classList.add('error');return}saveBtn.disabled=true;saveBtn.textContent='Зберігаємо…';const {error}=await sb.auth.updateUser({password:a});if(error){msg.textContent='Не вдалося змінити пароль. Відкрийте посилання з листа ще раз.';msg.classList.add('error');saveBtn.disabled=false;saveBtn.textContent='Зберегти пароль';return}msg.textContent='Пароль створено. Зараз відкриється BOSAN SYSTEM.';msg.classList.add('ok');setTimeout(()=>location.replace('./app-gate.html?v=20260910-password'),900)}
saveBtn.addEventListener('click',save);p2.addEventListener('keydown',e=>{if(e.key==='Enter')save()});
</script></body></html>
