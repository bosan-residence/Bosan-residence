<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BOSAN SYSTEM · Новий пароль</title>
<style>
:root{--green:#123f31;--bg:#f4f2ec;--card:#fff;--line:#dedbd2;--muted:#73736f;--danger:#9c342d;--ok:#276749}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:#17201c}.app{max-width:560px;margin:auto;min-height:100vh}.top{background:var(--green);color:#fff;padding:18px 16px;box-shadow:0 4px 14px #0002}.brand{display:flex;justify-content:space-between;align-items:center}.brand b{font-size:20px;letter-spacing:2px}.brand small{opacity:.75}.pill{font-size:11px;padding:6px 9px;border:1px solid #ffffff55;border-radius:999px}main{padding:13px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-top:48px}.title{font-weight:900;font-size:22px;margin-bottom:8px}.sub{font-size:13px;color:var(--muted);line-height:1.5}input{width:100%;padding:14px;border:1px solid var(--line);border-radius:11px;background:#fff;margin-top:10px;font:inherit}.btn{width:100%;border:0;border-radius:12px;padding:14px 12px;font-weight:800;background:var(--green);color:#fff;margin-top:12px;font:inherit}.btn:disabled{opacity:.55}.msg{font-size:12px;margin-top:12px;line-height:1.45}.msg.error{color:var(--danger)}.msg.ok{color:var(--ok)}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body><div class="app"><header class="top"><div class="brand"><div><b>BOSAN</b><small> RESIDENCE</small></div><div class="pill">ПАРОЛЬ</div></div></header><main><section class="card"><div class="title">Створіть новий пароль</div><p class="sub">Введіть новий пароль двічі.</p><input id="p1" type="password" autocomplete="new-password" placeholder="Новий пароль" disabled><input id="p2" type="password" autocomplete="new-password" placeholder="Повторіть пароль" disabled><button id="saveBtn" class="btn" disabled>Перевіряємо посилання…</button><div id="msg" class="msg"></div></section></main></div>
<script>
const sb=window.supabase.createClient('https://eonflhmttzpbqzzqkhon.supabase.co','sb_publishable_XKHT-jFqx5nn4dfMODy0Ew_Ndmje_0P',{auth:{detectSessionInUrl:true,persistSession:true}});
let ready=false;
function setReady(){ready=true;p1.disabled=false;p2.disabled=false;saveBtn.disabled=false;saveBtn.textContent='Зберегти пароль';msg.textContent='Посилання підтверджено. Створіть новий пароль.';msg.className='msg ok'}
function setBad(text){ready=false;p1.disabled=true;p2.disabled=true;saveBtn.disabled=true;saveBtn.textContent='Посилання недійсне';msg.textContent=text||'Посилання для зміни пароля недійсне або вже використане. Запросіть новий лист.';msg.className='msg error'}
async function prepareRecovery(){
  try{
    const url=new URL(location.href);
    const code=url.searchParams.get('code');
    if(code){
      const {error}=await sb.auth.exchangeCodeForSession(code);
      if(error) throw error;
      history.replaceState({},'',url.pathname);
    }
    const h=new URLSearchParams(location.hash.replace(/^#/,''));
    const access_token=h.get('access_token'), refresh_token=h.get('refresh_token');
    if(access_token&&refresh_token){
      const {error}=await sb.auth.setSession({access_token,refresh_token});
      if(error) throw error;
      history.replaceState({},'',location.pathname);
    }
    const {data:{session}}=await sb.auth.getSession();
    if(session){setReady();return}
    let settled=false;
    const {data:{subscription}}=sb.auth.onAuthStateChange((event,session2)=>{
      if(settled)return;
      if(event==='PASSWORD_RECOVERY'||(session2&&event==='SIGNED_IN')){settled=true;subscription.unsubscribe();setReady()}
    });
    setTimeout(async()=>{
      if(settled)return;
      const {data:{session:late}}=await sb.auth.getSession();
      if(late){settled=true;subscription.unsubscribe();setReady()}else{setBad('Не вдалося підтвердити посилання. Поверніться в BOSAN, натисніть «Забули пароль?» і відкрийте новий лист.')}
    },2500);
  }catch(e){setBad('Не вдалося підтвердити посилання. Запросіть новий лист для зміни пароля.')}
}
async function save(){
  if(!ready)return;
  const a=p1.value,b=p2.value;msg.className='msg';
  if(a.length<8){msg.textContent='Пароль має містити щонайменше 8 символів.';msg.classList.add('error');return}
  if(a!==b){msg.textContent='Паролі не збігаються.';msg.classList.add('error');return}
  saveBtn.disabled=true;saveBtn.textContent='Зберігаємо…';
  const {error}=await sb.auth.updateUser({password:a});
  if(error){msg.textContent='Не вдалося змінити пароль: '+(error.message||'невідома помилка');msg.classList.add('error');saveBtn.disabled=false;saveBtn.textContent='Зберегти пароль';return}
  msg.textContent='Пароль створено. Зараз відкриється BOSAN SYSTEM.';msg.classList.add('ok');
  setTimeout(()=>location.replace('./app-gate.html?v=20260910-recovery2'),900)
}
saveBtn.addEventListener('click',save);p2.addEventListener('keydown',e=>{if(e.key==='Enter')save()});prepareRecovery();
</script></body></html>
